name: Compatibility with current nightly Rust

on:
  schedule:
    - cron: "17 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: ${{ matrix.benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - benchmark: arrayvec
            channel: nightly
          - benchmark: async-task
            channel: nightly
          - benchmark: getrandom
            channel: nightly
          - benchmark: hashbrown
            channel: nightly
          - benchmark: httparse
            channel: nightly
          - benchmark: jni
            channel: nightly
          - benchmark: jpeg-decoder-master
            channel: nightly
          - benchmark: matrixmultiply
            channel: nightly
          - benchmark: memchr
            channel: nightly
          - benchmark: ndarray
            channel: nightly
          - benchmark: parking_lot
            channel: nightly
          - benchmark: petgraph
            channel: nightly
          - benchmark: rayon
            channel: nightly
          - benchmark: semver
            channel: nightly
          - benchmark: simd-json
            channel: nightly
          - benchmark: ring
            channel: nightly
          - benchmark: smallvec
            channel: nightly
          - benchmark: tokio
            channel: nightly

    steps:
      - uses: actions/checkout@v4

      - name: Install latest nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Java for JNI benchmarks
        if: matrix.benchmark == 'jni'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run benchmark suite
        env:
          BENCHMARK: ${{ matrix.benchmark }}
          RUSTUP_TOOLCHAIN: ${{ matrix.channel }}
        run: |
          case "$BENCHMARK" in
            memchr)
              cargo build --release --locked --manifest-path rebar/Cargo.toml
              cd rebar
              ./target/release/rebar build -e 'rust/memchr/memmem/(prebuilt)'
              ;;
            rayon)
              cargo build --release --locked \
                --manifest-path rayon/rayon-demo/Cargo.toml
              ;;
            jni)
              cargo bench --no-run --locked --features invocation \
                --manifest-path jni/Cargo.toml
              ;;
            parking_lot)
              cargo build --release --locked \
                --manifest-path parking_lot/benchmark/Cargo.toml
              ;;
            ring)
              cargo bench --no-run --locked --benches \
                --manifest-path ring/Cargo.toml
              ;;
            *)
              cargo bench --no-run --locked \
                --manifest-path "$BENCHMARK/Cargo.toml"
              ;;
          esac
